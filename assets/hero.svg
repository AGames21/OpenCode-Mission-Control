<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="60%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7aa2ff" opacity="0.18"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7aa2ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6fd3c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <g stroke="url(#edge)" stroke-width="1.6">
    <line x1="600" y1="150" x2="380" y2="90"/>
    <line x1="600" y1="150" x2="820" y2="90"/>
    <line x1="600" y1="150" x2="330" y2="230"/>
    <line x1="600" y1="150" x2="870" y2="230"/>
    <line x1="380" y1="90" x2="250" y2="60"/>
    <line x1="820" y1="90" x2="950" y2="60"/>
  </g>
  <g>

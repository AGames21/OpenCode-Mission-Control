    <circle cx="950" cy="60" r="26" fill="url(#glow)" opacity="0.35"/>
    <circle cx="330" cy="230" r="26" fill="url(#glow)" opacity="0.35"/>
    <circle cx="870" cy="230" r="26" fill="url(#glow)" opacity="0.35"/>
    <circle cx="600" cy="150" r="46" fill="url(#glow)" opacity="0.4"/>
